name: Public code checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-code-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: pnpm
      - name: Public file and inactive-source boundary
        run: python3 scripts/check_public_repository.py
      - name: Public boundary regressions
        run: python3 -m unittest tests.test_public_repository
      - name: Use Python 3.12 for offline worker checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Use pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.7'
          enable-cache: false
      - name: Locked Python parser dependencies
        run: uv sync --locked --no-python-downloads
      - name: Offline passage planning and feed discovery
        run: uv run --locked --offline --no-sync --no-python-downloads --no-env-file python -B -m unittest tests.test_private_diagnostic_redaction tests.test_docker_inspect_command_log tests.test_feed_trial_inspect_logging tests.test_bounded_worker_cleanup_faults tests.test_pdf_parent_cleanup_faults tests.test_prose_passage_selection tests.test_passage_model_plan tests.test_passage_model_proposal tests.test_feed_discovery tests.test_feed_window_comparison tests.test_feed_discovery_report tests.test_offline_feed_report tests.test_feed_storage_progress tests.test_invented_feed_journal tests.test_invented_feed_processing tests.test_invented_feed_journal_report tests.test_feed_postgres_contract tests.test_feed_postgres_processing tests.test_document_passage_binding tests.test_document_quote_preparation tests.test_document_quote_command tests.test_document_quote_command_process tests.test_plain_document_entry_snapshot tests.test_document_comparison_entry_snapshot tests.test_document_result_contract tests.test_document_result_entry_snapshot tests.test_document_result_restore_scope tests.test_document_passage_comparison tests.test_document_dispatch_plan tests.test_fixed_response_envelope tests.test_passage_extraction_request tests.test_extraction_request_dispatch tests.test_feed_runtime_role_scope tests.test_feed_role_restore_scope tests.test_feed_window_lineage tests.test_feed_collection_inventory tests.test_feed_capture_reopen tests.test_document_result_reopen tests.test_complete_chain_restore_scope tests.test_feed_collection_reader tests.test_feed_stream_reader tests.test_stream_reader_restore_scope tests.test_reopened_document_change tests.test_stored_document_reference tests.test_model_proposal tests.test_retained_document_reader tests.test_private_extraction_result tests.test_private_extraction_postgres tests.test_private_extraction_trial_scope tests.test_private_extraction_capacity tests.test_private_extraction_reobservation tests.test_private_extraction_reopen test