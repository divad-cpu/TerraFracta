name: Public code checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-code-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: pnpm
      - name: Public file and inactive-source boundary
        run: python3 scripts/check_public_repository.py
      - name: Public boundary regressions
        run: python3 -m unittest tests.test_public_repository
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Checked saved-run smoke suite
        run: node --experimental-strip-types --test --test-isolation=none --test-concurrency=1 tests/fictional_saved_run_import.test.mjs tests/saved_comparison_validation_refusal.test.mjs
      - name: Types and production private-asset boundary
        run: pnpm typecheck && pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
